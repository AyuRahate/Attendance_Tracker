<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Smart Attendance Tracker for college students — track minimum percentage, safe bunks, and schedule." />
    <meta name="theme-color" content="#0a0a14" id="theme-color-meta" />
    <title>Smart Attendance Tracker</title>
    <!-- Prevent flash of wrong theme: apply saved preference before React renders -->
    <script>
      (function() {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.getElementById('theme-color-meta');
        if (meta) meta.content = t === 'light' ? '#f8fafc' : '#0a0a14';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
